name: Build Cross-Platform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (amd64 & arm64)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: mqtt-client-linux-amd64
            binary: mqtt-client
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: mqtt-client-linux-arm64
            binary: mqtt-client

          # macOS (amd64 & arm64 / Apple Silicon)
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: mqtt-client-macos-amd64
            binary: mqtt-client
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: mqtt-client-macos-arm64
            binary: mqtt-client

          # Windows (amd64 & arm64)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: mqtt-client-windows-amd64.exe
            binary: mqtt-client.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: mqtt-client-windows-arm64.exe
            binary: mqtt-client.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI system headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Single Binary (Release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
