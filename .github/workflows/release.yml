name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (amd64 & arm64)
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mqtt-client
            package: tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: mqtt-client
            package: tar.gz

          # macOS (amd64 & arm64 / Apple Silicon)
          - name: macos-amd64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: mqtt-client
            package: tar.gz
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: mqtt-client
            package: tar.gz

          # Windows (amd64 & arm64)
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mqtt-client.exe
            package: zip
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: mqtt-client.exe
            package: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI system headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Archive (Linux / macOS)
        if: matrix.package == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          chmod +x "dist/${{ matrix.binary }}"
          tar -czf "mqtt-client-${{ matrix.name }}.tar.gz" -C dist "${{ matrix.binary }}"

      - name: Package Archive & Standalone EXE (Windows)
        if: matrix.package == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "mqtt-client-${{ matrix.name }}.exe"
          Compress-Archive -Path "dist/*" -DestinationPath "mqtt-client-${{ matrix.name }}.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            mqtt-client-${{ matrix.name }}.tar.gz
            mqtt-client-${{ matrix.name }}.zip
            mqtt-client-${{ matrix.name }}.exe
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
