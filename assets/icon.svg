<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1629"/>
      <stop offset="50%" stop-color="#132342"/>
      <stop offset="100%" stop-color="#183B5E"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8"/>

  <!-- Topic Tree Connections -->
  <g stroke="#4ADE80" stroke-opacity="0.8" stroke-width="12" stroke-linecap="round">
    <line x1="168" y1="344" x2="348" y2="164"/>
    <line x1="348" y1="164" x2="368" y2="286"/>
    <line x1="348" y1="164" x2="225" y2="144"/>
  </g>

  <!-- MQTT Broadcast Signal Arcs -->
  <g fill="none" stroke="url(#waveGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)">
    <path d="M 182 258 A 88 88 0 0 1 254 330"/>
    <path d="M 192 186 A 158 158 0 0 1 326 320"/>
    <path d="M 204 114 A 230 230 0 0 1 398 308"/>
  </g>

  <!-- Topic & Broker Nodes -->
  <g filter="url(#glow)">
    <circle cx="168" cy="344" r="34" fill="#2EE59D"/>
    <circle cx="168" cy="344" r="18" fill="#F8FAFC"/>

    <circle cx="348" cy="164" r="27" fill="#22D3EE"/>
    <circle cx="348" cy="164" r="14" fill="#F8FAFC"/>

    <circle cx="368" cy="286" r="19" fill="#34D399"/>
    <circle cx="368" cy="286" r="10" fill="#F8FAFC"/>

    <circle cx="225" cy="144" r="19" fill="#34D399"/>
    <circle cx="225" cy="144" r="10" fill="#F8FAFC"/>
  </g>
</svg>
