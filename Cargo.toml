[package]
name = "mqtt-client"
version = "0.2.2"
edition = "2021"
description = "Lightweight, portable single-binary MQTT 3.1 / 3.1.1 / 5.0 GUI client with TLS & Auth"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.18"
tokio = { version = "1.40", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
webpki-roots = "0.26"
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rmp-serde = "1.3"
base64 = "0.23"
hex = "0.4"
chrono = "0.4"
similar = "2.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
